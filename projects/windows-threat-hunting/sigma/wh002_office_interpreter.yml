title: Office application starts a command interpreter
id: ea8c4732-4033-4fb8-8dd9-70c385bf1002
status: experimental
description: An Office parent launches a command or script interpreter. Investigate the document and command line before disposition.
author: Portfolio laboratory
date: 2026-10-17
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|re: '(?i)(?:^|\\)(?:winword|excel|powerpnt|outlook)\.exe$'
  selection_child:
    Image|re: '(?i)(?:^|\\)(?:powershell|pwsh|cmd|wscript|cscript)\.exe$'
  condition: selection_parent and selection_child
falsepositives:
  - Approved Office integrations and macros that launch interpreter processes
level: medium
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1059
